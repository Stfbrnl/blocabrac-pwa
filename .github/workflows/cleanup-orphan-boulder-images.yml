name: Nettoyage images Cloudinary orphelines

# Chantier 4 (PLAN-spark-images-competition.md) : supprime mensuellement les images de
# blocs qui ne sont plus référencées par aucun document Firestore "boulders" et qui ont
# plus de 7 jours (voir scripts/cleanup-orphan-boulder-images.js pour tous les
# garde-fous — mode simulation par défaut, ce workflow passe explicitement --delete).
on:
  schedule:
    - cron: '0 3 1 * *' # 03h00 UTC le 1er de chaque mois
  workflow_dispatch: {} # déclenchement manuel possible depuis l'onglet Actions

permissions:
  contents: write # nécessaire pour committer cleanup-state/ après l'exécution

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - run: npm ci

      - name: Nettoyage des images Cloudinary orphelines
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: node scripts/cleanup-orphan-boulder-images.js --delete

      - name: Committer l'état mis à jour (garde-fou anti-chute + journal)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cleanup-state/
          git diff --staged --quiet || git commit -m "chore: mise à jour cleanup-state (nettoyage images orphelines)"
          git push
